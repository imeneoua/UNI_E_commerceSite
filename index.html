<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce website</title>
    <link rel="stylesheet" href="https://boxicons.com/icons?free=true">
</head>
<body>
    <div id="logpg" class="login">
        <h2>Login</h2>
        <label>Email</label>
        <input type="Email" required placeholder="Enter your email">
        <i class="bx bx-envelope bx-remove-padding"></i>
        <br>
        <label>Password</label>
        <input type="password" required placeholder="Enter your password">
        <i class="bx bx-lock"></i>
        <br>
        <label><input type="checkbox">Remember Me</label>
        <a href="#">Forget password?</a>
        <br>
        <input type="submit" value="Login">
        <hr> 
        <button>Connect with google</button>
        <p>D'ont have an account? <a href="#"> Sign in</a></p>
        
    </div>
</body>
</html>
