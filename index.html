<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecommerce website</title>
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- login page -->
    <div id="logpg" class="logipage">
      <h2>Login</h2>
      <form method="post">
        <label>Email</label>
        <input type="email" required placeholder="Enter your email" />
        <i class="bx bx-envelope bx-remove-padding"></i>
        <br />
        <label>Password</label>
        <input type="password" required placeholder="Enter your password" />
        <i class="bx bx-lock"></i>
        <br />
        <label><input type="checkbox" />Remember Me</label>
        <a href="#">Forgot password?</a>
        <br />
        <input type="submit" value="login" />
        <!-- OR Divider -->
        <table>
          <tr>
            <td width="45%"><hr /></td>
            <td width="1%" align="center">or</td>
            <td width="45%"><hr /></td>
          </tr>
        </table>
        <button><i class="bx bxl-google"></i>Connect with google</button>
        <p>D'ont have an account? <a href="#"> Sign in</a></p>
      </form>
    </div>

    <!--Sign in -->
    <div id="singpg" class="logipage">
      <h2>Sign in</h2>
      <form method="post">
        <label>Email</label>
        <input type="email" required placeholder="Enter your email" />
        <i class="bx bx-envelope bx-remove-padding"></i>
        <br />
        <label>Password</label>
        <input type="password" required placeholder="Enter your password">
        <i class="bx bx-lock"></i>
      </br>
        <a href="#">Forgot password?</a>
        <br />
        <input type="submit" value="sign in" />
        <!-- OR Divider -->
        <table>
          <tr>
            <td width="45%"><hr /></td>
            <td width="1%" align="center">or</td>
            <td width="45%"><hr /></td>
          </tr>
        </table>
        <button><i class="bx bxl-google"></i> Connect with Google</button>
        <p>Already have an account <a href="#">Login</a></p>
      </form>
    </div>
    <br />
  </body>
</html>
